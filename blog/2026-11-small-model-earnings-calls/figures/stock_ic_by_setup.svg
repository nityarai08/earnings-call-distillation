<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="-apple-system, Helvetica, Arial, sans-serif"><rect width="760" height="412" fill="white"/><text x="20.0" y="28.0" font-size="16" fill="#1f1f1f" text-anchor="start" font-weight="600">Every AI setup that reads the transcript ranks stocks at about 0.10</text><text x="20.0" y="50.0" font-size="13" fill="#666666" text-anchor="start" font-weight="normal">Stock-ranking score (IC), 800 sealed test calls, Mar to Aug 2026. Higher is better; 0 is a coin flip.</text><rect x="20" y="66" width="12" height="12" rx="2" fill="#2a78d6"/><text x="38.0" y="77.0" font-size="13" fill="#666666" text-anchor="start" font-weight="normal">AI model</text><rect x="200" y="66" width="12" height="12" rx="2" fill="#a3c5ee"/><text x="218.0" y="77.0" font-size="13" fill="#666666" text-anchor="start" font-weight="normal">AI model, no transcript</text><rect x="380" y="66" width="12" height="12" rx="2" fill="#c4c4bb"/><text x="398.0" y="77.0" font-size="13" fill="#666666" text-anchor="start" font-weight="normal">simple rule, no AI</text><text x="160.0" y="119.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">RL</text><rect x="170" y="107" width="407.8" height="20" rx="3" fill="#2a78d6"/><text x="583.8" y="121.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.113</text><text x="160.0" y="151.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">SFT</text><rect x="170" y="139" width="379.3" height="20" rx="3" fill="#2a78d6"/><text x="555.3" y="153.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.105</text><text x="160.0" y="183.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">Raw</text><rect x="170" y="171" width="377.8" height="20" rx="3" fill="#2a78d6"/><text x="553.8" y="185.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.104</text><text x="160.0" y="215.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">Pi</text><rect x="170" y="203" width="374.2" height="20" rx="3" fill="#2a78d6"/><text x="550.2" y="217.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.103</text><text x="160.0" y="247.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">RAG</text><rect x="170" y="235" width="348.2" height="20" rx="3" fill="#2a78d6"/><text x="524.2" y="249.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.096</text><text x="160.0" y="279.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">Known-EPS rule</text><rect x="170" y="267" width="306.2" height="20" rx="3" fill="#c4c4bb"/><text x="482.2" y="281.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.085</text><text x="160.0" y="311.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">Memory only</text><rect x="170" y="299" width="271.9" height="20" rx="3" fill="#a3c5ee"/><text x="447.9" y="313.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.075</text><text x="160.0" y="343.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">Numbers only</text><rect x="170" y="331" width="249.8" height="20" rx="3" fill="#c4c4bb"/><text x="425.8" y="345.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.069</text><text x="160.0" y="375.0" font-size="13" fill="#1f1f1f" text-anchor="end" font-weight="normal">Word list</text><rect x="170" y="363" width="228.1" height="20" rx="3" fill="#c4c4bb"/><text x="404.1" y="377.0" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="normal">0.063</text><line x1="170" x2="170" y1="98" y2="392" stroke="#bbbbbb"/></svg>
